server:
  address: 127.0.0.1
  port: ${JOB_TRACKER_PORT:18080}

spring:
  application:
    name: job-tracker-desktop
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${JOB_TRACKER_DATA_DIR:./desktop-data}/jobtracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: ${JOB_TRACKER_H2_USERNAME:sa}
    password: ${JOB_TRACKER_H2_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

job-tracker:
  storage:
    resume-dir: ${JOB_TRACKER_DATA_DIR:./desktop-data}/resumes
    note-dir: ${JOB_TRACKER_DATA_DIR:./desktop-data}/interview_notes
    general-note-dir: ${JOB_TRACKER_DATA_DIR:./desktop-data}/notes

