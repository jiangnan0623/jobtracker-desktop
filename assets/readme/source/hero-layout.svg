<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="title desc">
  <title id="title">JobTracker Desktop</title>
  <desc id="desc">本地运行的个人求职进度管理工具，右侧展示真实 Dashboard 界面。</desc>

  <defs>
    <clipPath id="dashboard-clip">
      <rect x="570" y="52" width="578" height="362" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#18212f"/>
  <path d="M0 430 H1200" stroke="#2d3949" stroke-width="1"/>

  <g id="title-block" transform="translate(58 48)">
    <text x="0" y="0" dominant-baseline="hanging"
          fill="#8fbfff" font-size="18" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WINDOWS DESKTOP · LOCAL-FIRST</text>

    <text x="0" y="58" dominant-baseline="hanging"
          fill="#ffffff" font-size="72" font-weight="800"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">JOBTRACKER</text>
    <text x="0" y="136" dominant-baseline="hanging"
          fill="#ffffff" font-size="72" font-weight="800"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">DESKTOP</text>

    <text x="2" y="246" dominant-baseline="hanging"
          fill="#d8e0eb" font-size="25" font-weight="600"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">把投递、流程、简历、笔记与日程</text>
    <text x="2" y="282" dominant-baseline="hanging"
          fill="#d8e0eb" font-size="25" font-weight="600"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">收进一台电脑。</text>

    <g transform="translate(2 342)"
       font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
       font-size="18" font-weight="600">
      <circle cx="6" cy="7" r="6" fill="#2f80ed"/>
      <text x="22" y="0" dominant-baseline="hanging" fill="#aeb9c8">数据留在本机</text>
      <circle cx="174" cy="7" r="6" fill="#22c55e"/>
      <text x="190" y="0" dominant-baseline="hanging" fill="#aeb9c8">自动启动本地服务</text>
    </g>
  </g>

  <g id="dashboard-proof">
    <rect x="582" y="66" width="578" height="362" rx="16" fill="#0a1019" opacity=".38"/>
    <image x="570" y="52" width="578" height="362"
           href="../screenshots/dashboard.png"
           xlink:href="../screenshots/dashboard.png"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#dashboard-clip)"/>
    <rect x="570" y="52" width="578" height="362" rx="16"
          fill="none" stroke="#405066" stroke-width="2"/>

    <g transform="translate(822 382)"
       font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif"
       font-size="17" font-weight="700">
      <rect x="0" y="0" width="102" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="20" cy="19" r="5" fill="#2f80ed"/>
      <text x="32" y="9" dominant-baseline="hanging" fill="#1d4ed8">已投递</text>

      <rect x="112" y="0" width="82" height="38" rx="19" fill="#ecfeff" stroke="#a5f3fc"/>
      <circle cx="132" cy="19" r="5" fill="#0891b2"/>
      <text x="144" y="9" dominant-baseline="hanging" fill="#0e7490">二面</text>

      <rect x="204" y="0" width="92" height="38" rx="19" fill="#f0fdf4" stroke="#bbf7d0"/>
      <circle cx="224" cy="19" r="5" fill="#22c55e"/>
      <text x="236" y="9" dominant-baseline="hanging" fill="#15803d">Offer</text>
    </g>
  </g>

  <g id="progress-rail" transform="translate(58 462)"
     font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <path d="M8 0 H1090" stroke="#405066" stroke-width="2"/>
    <g fill="#18212f" stroke="#718096" stroke-width="2">
      <circle cx="8" cy="0" r="8"/>
      <circle cx="122" cy="0" r="8"/>
      <circle cx="236" cy="0" r="8"/>
      <circle cx="350" cy="0" r="8"/>
    </g>
    <circle cx="464" cy="0" r="9" fill="#22c55e"/>
    <g fill="#9eabba" font-size="17" font-weight="600">
      <text x="8" y="23" text-anchor="middle">收藏</text>
      <text x="122" y="23" text-anchor="middle">投递</text>
      <text x="236" y="23" text-anchor="middle">笔试</text>
      <text x="350" y="23" text-anchor="middle">面试</text>
      <text x="464" y="23" text-anchor="middle" fill="#86efac">Offer</text>
    </g>
    <text x="1090" y="-9" text-anchor="end" fill="#718096" font-size="16"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">REAL PRODUCT VIEW · DASHBOARD</text>
  </g>
</svg>
