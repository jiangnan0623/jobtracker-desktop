<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">JobTracker Desktop 求职工作流</title>
  <desc id="desc">从记录岗位、绑定简历、推进流程、安排日程到复盘归档，所有信息围绕一条投递记录组织并保存在本地。</desc>
  <rect width="1200" height="340" rx="26" fill="#f7f5f1"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="54" y="45" dominant-baseline="hanging" fill="#2f2d29" font-family="Georgia,'Noto Serif SC','Songti SC',serif" font-size="39" font-weight="700">一条投递记录，串起整个求职过程</text>
    <text x="54" y="101" dominant-baseline="hanging" fill="#6f6b64" font-size="19">信息不再散落在表格、文件夹和日历里；每一步都能回到对应岗位。</text>

    <path d="M102 205H1098" stroke="#ded9cf" stroke-width="4" stroke-linecap="round"/>
    <path d="M102 205H850" stroke="#c15f3c" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(102 205)">
      <circle r="19" fill="#c15f3c"/><text y="7" text-anchor="middle" fill="#fffdf9" font-size="16" font-weight="800">1</text>
      <text y="48" text-anchor="middle" fill="#2f2d29" font-size="22" font-weight="700">记录岗位</text><text y="78" text-anchor="middle" fill="#6f6b64" font-size="16">JD 与来源</text>
    </g>
    <g transform="translate(351 205)">
      <circle r="19" fill="#c15f3c"/><text y="7" text-anchor="middle" fill="#fffdf9" font-size="16" font-weight="800">2</text>
      <text y="48" text-anchor="middle" fill="#2f2d29" font-size="22" font-weight="700">绑定简历</text><text y="78" text-anchor="middle" fill="#6f6b64" font-size="16">保留投递版本</text>
    </g>
    <g transform="translate(600 205)">
      <circle r="19" fill="#c15f3c"/><text y="7" text-anchor="middle" fill="#fffdf9" font-size="16" font-weight="800">3</text>
      <text y="48" text-anchor="middle" fill="#2f2d29" font-size="22" font-weight="700">推进流程</text><text y="78" text-anchor="middle" fill="#6f6b64" font-size="16">笔试 · 面试 · 结果</text>
    </g>
    <g transform="translate(849 205)">
      <circle r="19" fill="#c15f3c"/><text y="7" text-anchor="middle" fill="#fffdf9" font-size="16" font-weight="800">4</text>
      <text y="48" text-anchor="middle" fill="#2f2d29" font-size="22" font-weight="700">安排日程</text><text y="78" text-anchor="middle" fill="#6f6b64" font-size="16">提醒关联岗位</text>
    </g>
    <g transform="translate(1098 205)">
      <circle r="19" fill="#71816a"/><text y="7" text-anchor="middle" fill="#fffdf9" font-size="16" font-weight="800">5</text>
      <text y="48" text-anchor="middle" fill="#2f2d29" font-size="22" font-weight="700">复盘归档</text><text y="78" text-anchor="middle" fill="#6f6b64" font-size="16">沉淀经验材料</text>
    </g>

    <g transform="translate(900 42)">
      <rect width="244" height="44" rx="22" fill="#fffdf9" stroke="#ded9cf"/>
      <circle cx="23" cy="22" r="7" fill="#71816a"/>
      <text x="42" y="28" fill="#596653" font-size="15" font-weight="700" letter-spacing="1.2">H2 + LOCAL FILES</text>
    </g>
  </g>
</svg>
