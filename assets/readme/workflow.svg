<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">JobTracker Desktop 工作流</title>
  <desc id="desc">从发现岗位、绑定简历、跟进招聘流程、安排日程到复盘归档，数据保存在本地。</desc>

  <rect width="1200" height="360" rx="24" fill="#f7f9fc"/>
  <text x="58" y="46" dominant-baseline="hanging"
        fill="#172033" font-size="42" font-weight="800"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">一条记录，串起整个求职过程</text>
  <text x="58" y="105" dominant-baseline="hanging"
        fill="#667085" font-size="20" font-weight="600"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">每一步都能回到对应岗位，不再在表格、文件夹和日历之间来回找。</text>

  <path d="M110 220 H1088" stroke="#c8d2df" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 220 H840" stroke="#2f80ed" stroke-width="4" stroke-linecap="round"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(110 220)">
      <circle r="19" fill="#2f80ed"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">1</text>
      <text x="0" y="42" text-anchor="middle" fill="#172033" font-size="24" font-weight="800">发现岗位</text>
      <text x="0" y="76" text-anchor="middle" fill="#667085" font-size="18">JD 与岗位信息</text>
    </g>
    <g transform="translate(354 220)">
      <circle r="19" fill="#2f80ed"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">2</text>
      <text x="0" y="42" text-anchor="middle" fill="#172033" font-size="24" font-weight="800">绑定简历</text>
      <text x="0" y="76" text-anchor="middle" fill="#667085" font-size="18">保留实际投递版本</text>
    </g>
    <g transform="translate(598 220)">
      <circle r="19" fill="#2f80ed"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">3</text>
      <text x="0" y="42" text-anchor="middle" fill="#172033" font-size="24" font-weight="800">跟进流程</text>
      <text x="0" y="76" text-anchor="middle" fill="#667085" font-size="18">笔试 · 面试 · 结果</text>
    </g>
    <g transform="translate(842 220)">
      <circle r="19" fill="#2f80ed"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">4</text>
      <text x="0" y="42" text-anchor="middle" fill="#172033" font-size="24" font-weight="800">安排日程</text>
      <text x="0" y="76" text-anchor="middle" fill="#667085" font-size="18">提醒与岗位关联</text>
    </g>
    <g transform="translate(1086 220)">
      <circle r="19" fill="#22c55e"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">5</text>
      <text x="0" y="42" text-anchor="middle" fill="#172033" font-size="24" font-weight="800">复盘归档</text>
      <text x="0" y="76" text-anchor="middle" fill="#667085" font-size="18">记录经验与材料</text>
    </g>
  </g>

  <g transform="translate(918 44)"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="16" font-weight="700">
    <rect width="224" height="40" rx="20" fill="#18212f"/>
    <circle cx="22" cy="20" r="6" fill="#22c55e"/>
    <text x="40" y="12" dominant-baseline="hanging" fill="#d8e0eb">H2 + LOCAL FILES</text>
  </g>
</svg>
