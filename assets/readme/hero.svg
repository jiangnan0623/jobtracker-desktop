  <circle cx="1097" cy="73" r="93" fill="#f4e4dc"/>
  <circle cx="1047" cy="59" r="9" fill="#c15f3c" opacity=".42"/>
  <circle cx="1124" cy="119" r="6" fill="#bd8a31" opacity=".55"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
