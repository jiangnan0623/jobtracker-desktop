<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">JobTracker Desktop</title>
  <desc id="desc">Windows 本地优先的个人求职工作台，统一管理投递、流程、简历、笔记和日程。</desc>

  <rect width="1200" height="440" rx="28" fill="#f7f5f1"/>
