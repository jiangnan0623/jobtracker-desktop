name: Build Windows desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

# Required to publish GitHub Releases from a tag push.
permissions:
  contents: write

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Build lite installer
        shell: pwsh
        run: desktop/build-desktop-lite.ps1 -Maven mvn.cmd -Jlink jlink.exe

      - name: Build full installer
        shell: pwsh
        run: desktop/build-desktop-full.ps1 -Maven mvn.cmd -Jlink jlink.exe

      - name: List release output
        shell: pwsh
        run: Get-ChildItem desktop/release

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: jobtracker-windows-installers
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: JobTracker Desktop ${{ github.ref_name }}
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
