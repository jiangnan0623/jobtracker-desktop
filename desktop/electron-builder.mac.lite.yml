appId: com.jobtracker.desktop
productName: 个人求职助手
directories:
  output: release
files:
  - main.js
  - preload.js
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  identity: null
  hardenedRuntime: false
artifactName: ${productName}-${version}-mac-lite-${arch}.${ext}
extraResources:
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
