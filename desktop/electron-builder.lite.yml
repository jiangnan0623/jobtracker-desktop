appId: com.jobtracker.desktop
productName: 个人求职助手
directories:
  output: release
files:
  - main.js
  - preload.js
  - package.json
  - resources/icon.png
win:
  icon: resources/icon.ico
  signAndEditExecutable: true
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 个人求职助手
artifactName: ${productName} Setup ${version}-lite.${ext}
extraResources:
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
