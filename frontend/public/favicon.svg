  <circle cx="662" cy="528" r="43" fill="#C85F3C" stroke="#FFF8EF" stroke-width="27"/>
  <circle cx="398" cy="766" r="72" fill="#87977E" stroke="#FFF8EF" stroke-width="28"/>
  <path d="m363 766 24 24 48-54" fill="none" stroke="#FFF8EF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
