<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">JobTracker 应用图标</title>
  <desc id="desc">字母 J 化作带有进度节点的求职路径，并以绿色终点表示获得 Offer。</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9754F"/>
      <stop offset="0.58" stop-color="#C85F3C"/>
      <stop offset="1" stop-color="#A9432E"/>
    </linearGradient>
    <linearGradient id="shine" x1="216" y1="126" x2="680" y2="772" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#6F2D20" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)" filter="url(#shadow)"/>
